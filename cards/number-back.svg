  <rect x="22" y="22" width="316" height="316" rx="75" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>
  <rect x="34" y="34" width="292" height="292" rx="63" fill="url(#diamonds)"/>
  <circle cx="180" cy="180" r="54" fill="rgba(255,255,255,0.12)"/>
